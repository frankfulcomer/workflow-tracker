<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workflow Tracker</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <h1>Workflow Tracker</h1>
        <p class="subtitle">A generic request/ticket tracker demo app</p>
    </header>

    <main>
        <section class="panel">
            <h2>New Item</h2>
            <form id="create-form">
                <label>
                    Title
                    <input type="text" id="title" name="title" required maxlength="200">
                </label>
                <label>
                    Owner
                    <select id="owner" name="owner">
                        <option value="">Unassigned</option>
                    </select>
                </label>
                <label>
                    Description
                    <textarea id="description" name="description" rows="3" maxlength="2000"></textarea>
                </label>
                <button type="submit">Create</button>
                <span id="create-error" class="error"></span>
            </form>
        </section>

        <section class="panel">
            <div class="toolbar">
                <h2>Items</h2>
                <div class="filters">
                    <input type="search" id="search-box" placeholder="Search by title...">
                    <select id="status-filter">
                        <option value="">All statuses</option>
                        <option value="NEW">New</option>
                        <option value="OPEN">Open</option>
                        <option value="IN_PROGRESS">In Progress</option>
                        <option value="RESOLVED">Resolved</option>
                        <option value="CLOSED">Closed</option>
                    </select>
                </div>
            </div>
            <table id="items-table">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Owner</th>
                        <th>Status</th>
                        <th>Updated</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="items-body"></tbody>
            </table>
        </section>
    </main>

    <div id="item-detail-modal" class="modal hidden" data-testid="item-detail-modal">
        <div class="modal-content panel">
            <label>
                Title
                <input type="text" id="detail-title" maxlength="200" required>
            </label>
            <p>
                <span class="badge" id="detail-status-badge"></span>
            </p>
            <label>
                Description
                <textarea id="detail-description" rows="3"></textarea>
            </label>
            <label>
                Owner
                <select id="detail-owner"></select>
            </label>
            <p class="muted">
                Created: <span id="detail-created"></span> &middot;
                Updated: <span id="detail-updated"></span>
            </p>
            <h3>Status History</h3>
            <table id="detail-history-table">
                <thead>
                    <tr>
                        <th>Previous</th>
                        <th>New</th>
                        <th>Changed</th>
                    </tr>
                </thead>
                <tbody id="detail-history-body"></tbody>
            </table>
            <div class="modal-actions">
                <button type="button" class="secondary" id="detail-close-btn">Close</button>
                <button type="button" id="save-changes-btn" data-testid="save-changes-btn" disabled>Save Changes</button>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
