# Activate with: --spring.profiles.active=oracle
# Point at a real Oracle instance (e.g. Oracle XE) via environment variables:
#   ORACLE_URL=jdbc:oracle:thin:@localhost:1521/XEPDB1
#   ORACLE_USER=tracker
#   ORACLE_PASSWORD=yourpassword
#
# This exists to show the app is DB-agnostic, not hardcoded to H2 - swap
# profiles and it runs against the real thing with no code changes.

spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
spring.datasource.username=${ORACLE_USER:tracker}
spring.datasource.password=${ORACLE_PASSWORD:tracker}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=false
