spring.application.name=workflow-tracker

# Default profile: in-memory H2, zero setup. Good for local dev, demos, and CI.
spring.datasource.url=jdbc:h2:mem:trackerdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 web console at /h2-console (handy for demos: shows the data live)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080
